version: '3.8'

services:
  ccms-backend:
    build: .
    container_name: ccms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://ccms-mongodb:27017/ccms_db
    depends_on:
      - ccms-mongodb

  ccms-mongodb:
    image: mongo:7.0
    container_name: ccms-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
